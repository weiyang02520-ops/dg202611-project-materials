  <rect x="760" y="365" width="340" height="290" rx="20" class="gate"/><text x="930" y="418" text-anchor="middle" class="head">连续融合状态</text><text x="930" y="473" text-anchor="middle" class="body">state x̂</text><text x="930" y="520" text-anchor="middle" class="body">covariance P</text><line x1="805" y1="548" x2="1055" y2="548" stroke="#2F5597" stroke-width="2"/><text x="930" y="592" text-anchor="middle" class="body">平面 + 高程联合维护</text><text x="930" y="632" text-anchor="middle" class="small">输出同时携带置信度</text>

  <rect x="1160" y="120" width="390" height="210" rx="20" fill="#F6FBFA" stroke="#0F6B6D" stroke-width="3"/><text x="1355" y="170" text-anchor="middle" class="head">被动置信度判定</text><text x="1355" y="222" text-anchor="middle" class="body">充分 → 连续定位输出</text><text x="1355" y="270" text-anchor="middle" class="small">不足 → recovery request</text><text x="1355" y="309" text-anchor="middle" class="small">不把低质量观测强行融合</text>
