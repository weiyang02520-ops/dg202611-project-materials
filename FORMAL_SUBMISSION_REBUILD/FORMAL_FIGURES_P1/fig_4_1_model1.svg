  <rect width="1600" height="900" fill="#fff"/><text x="800" y="58" text-anchor="middle" class="title">图4-1  模型1质量感知多源连续定位与渐进重接入流程</text>
  <rect x="40" y="95" width="310" height="560" rx="20" fill="#FAFBFC" stroke="#98A2B3" stroke-width="2"/>
  <text x="195" y="140" text-anchor="middle" class="head">多源观测与退化</text>
