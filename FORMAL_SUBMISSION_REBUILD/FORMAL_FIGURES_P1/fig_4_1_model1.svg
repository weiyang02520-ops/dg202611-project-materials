  <text x="195" y="218" text-anchor="middle" class="body">BDS / GNSS / RTK</text><text x="195" y="314" text-anchor="middle" class="body">2D LiDAR</text><text x="195" y="410" text-anchor="middle" class="body">IMU + Wheel</text><text x="195" y="506" text-anchor="middle" class="body">ZED 2i</text><text x="195" y="602" text-anchor="middle" class="body">UWB（条件接入）</text>
  <rect x="40" y="681" width="340" height="165" rx="18" fill="#FFF8ED" stroke="#C46A00" stroke-width="2"/>
  <text x="210" y="719" text-anchor="middle" class="head" fill="#9A4E00">显式退化输入</text><text x="210" y="756" text-anchor="middle" class="small">BDS / GNSS degradation</text><text x="210" y="793" text-anchor="middle" class="small">LiDAR geometry</text><text x="210" y="830" text-anchor="middle" class="small">degradation</text>

  <rect x="400" y="120" width="300" height="210" rx="20" class="gate"/><text x="550" y="160" text-anchor="middle" class="head">单源 health /</text><text x="550" y="197" text-anchor="middle" class="head">quality</text><text x="550" y="242" text-anchor="middle" class="body">时效 · 残差 · 几何</text><text x="550" y="282" text-anchor="middle" class="body">一致性 · 可见性</text><text x="550" y="316" text-anchor="middle" class="small">按源更新</text>
  <rect x="400" y="365" width="300" height="290" rx="20" fill="#F7FAFE" stroke="#2F5597" stroke-width="3"/>
