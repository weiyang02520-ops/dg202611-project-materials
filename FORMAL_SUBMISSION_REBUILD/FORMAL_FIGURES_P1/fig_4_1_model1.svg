  <rect x="435" y="445" width="230" height="52" rx="12" class="good"/><text x="550" y="480" text-anchor="middle" class="body" font-weight="700">ACCEPT</text>
  <rect x="435" y="517" width="230" height="52" rx="12" class="warn"/><text x="550" y="552" text-anchor="middle" class="body" font-weight="700">DOWNWEIGHT</text>
  <rect x="435" y="589" width="230" height="52" rx="12" class="bad"/><text x="550" y="624" text-anchor="middle" class="body" font-weight="700">REJECT</text>

