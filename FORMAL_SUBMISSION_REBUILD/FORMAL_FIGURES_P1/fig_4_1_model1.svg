    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C46A00"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","SimHei",sans-serif;fill:#1F2937}.title{font-size:40px;font-weight:700;fill:#17365D}.head{font-size:31px;font-weight:700}.body{font-size:30px}.small{font-size:29px}.source{fill:#F5F7FA;stroke:#667085;stroke-width:2}.gate{fill:#E9F2FF;stroke:#2F5597;stroke-width:3}.good{fill:#E7F5F3;stroke:#0F6B6D;stroke-width:3}.warn{fill:#FFF0D9;stroke:#C46A00;stroke-width:3}.bad{fill:#FCE8E6;stroke:#A61B1B;stroke-width:3}.flow{fill:none;stroke:#2F5597;stroke-width:4;marker-end:url(#ab)}.loop{fill:none;stroke:#C46A00;stroke-width:4;stroke-dasharray:12 8;marker-end:url(#ao)}
