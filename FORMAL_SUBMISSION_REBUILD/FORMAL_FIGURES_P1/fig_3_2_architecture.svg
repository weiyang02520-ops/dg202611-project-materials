  <text x="420" y="163" text-anchor="middle" class="small">Wheel</text><text x="420" y="198" text-anchor="middle" class="small">/ Odom</text><text x="572" y="180" text-anchor="middle" class="body">IMU</text><text x="752" y="163" text-anchor="middle" class="small">BDS / GNSS</text><text x="752" y="198" text-anchor="middle" class="small">/ RTK</text><text x="952" y="180" text-anchor="middle" class="small">2D LiDAR</text><text x="1125" y="180" text-anchor="middle" class="small">ZED 2i</text><text x="1295" y="163" text-anchor="middle" class="small">UWB</text><text x="1295" y="198" text-anchor="middle" class="small">条件接入</text><text x="1460" y="180" text-anchor="middle" class="small">底盘执行</text>

