  <rect x="355" y="311" width="350" height="104" rx="16" class="core"/><text x="530" y="354" text-anchor="middle" class="body" font-weight="700">平面 / 高程连续状态估计</text><text x="530" y="393" text-anchor="middle" class="small">状态 · 协方差 · 时间对齐</text>
