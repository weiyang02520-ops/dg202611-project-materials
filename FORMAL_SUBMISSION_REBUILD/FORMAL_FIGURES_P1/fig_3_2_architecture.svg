  <rect x="735" y="695" width="780" height="100" rx="16" class="comm"/><text x="1125" y="736" text-anchor="middle" class="body" font-weight="700">事件 → 短报文管理 → RSMC终端 / 服务 → 远端</text><text x="1125" y="778" text-anchor="middle" class="small">独立通信链；不作为定位观测源</text>

