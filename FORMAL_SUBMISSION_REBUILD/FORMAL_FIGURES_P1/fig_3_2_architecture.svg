    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","SimHei",sans-serif;fill:#1F2937}.title{font-size:40px;font-weight:700;fill:#17365D}.layerTitle{font-size:31px;font-weight:700;fill:#17365D}.body{font-size:30px}.small{font-size:29px}.chip{fill:#fff;stroke:#667085;stroke-width:2}.core{fill:#E9F2FF;stroke:#2F5597;stroke-width:3}.health{fill:#E7F5F3;stroke:#0F6B6D;stroke-width:3}.comm{fill:#FFF0D9;stroke:#C46A00;stroke-width:3}.flow{fill:none;stroke:#2F5597;stroke-width:4;marker-end:url(#aBlue)}.commflow{fill:none;stroke:#C46A00;stroke-width:4;marker-end:url(#aOrange)}
