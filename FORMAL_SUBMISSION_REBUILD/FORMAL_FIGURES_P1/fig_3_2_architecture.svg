  <rect x="1220" y="355" width="305" height="82" rx="14" class="comm"/><text x="1372" y="407" text-anchor="middle" class="body">任务 / 定位健康事件</text>
  <rect x="1220" y="475" width="305" height="82" rx="14" class="comm"/><text x="1372" y="527" text-anchor="middle" class="body">消息管理与终端适配</text>
