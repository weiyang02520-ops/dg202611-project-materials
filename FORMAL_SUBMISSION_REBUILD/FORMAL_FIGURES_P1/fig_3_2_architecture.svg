  <rect x="355" y="503" width="350" height="104" rx="16" class="health"/><text x="530" y="546" text-anchor="middle" class="body" font-weight="700">融合置信度与退化状态</text><text x="530" y="585" text-anchor="middle" class="small">NORMAL → DEGRADED</text>
  <rect x="735" y="503" width="390" height="104" rx="16" class="health"/><text x="930" y="546" text-anchor="middle" class="body" font-weight="700">主动搜索 · 候选验证</text><text x="930" y="585" text-anchor="middle" class="small">恢复确认 → 渐进重接入</text>

  <rect x="45" y="662" width="1510" height="165" rx="20" fill="#FCFCFD" stroke="#667085" stroke-width="2"/>
  <rect x="60" y="679" width="260" height="131" rx="16" fill="#E9EEF3"/><text x="190" y="727" text-anchor="middle" class="layerTitle">4 任务 / 通信层</text><text x="190" y="774" text-anchor="middle" class="small">任务决策 · 独立通信</text>
