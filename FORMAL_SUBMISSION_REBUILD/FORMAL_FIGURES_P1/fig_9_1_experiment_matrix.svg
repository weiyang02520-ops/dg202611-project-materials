    <rect x="955" y="305" width="220" height="100" rx="14" class="cell"/><text x="1065" y="345" text-anchor="middle" class="small">一致性检查</text><text x="1065" y="386" text-anchor="middle" class="small">证据矩阵</text>
    <rect x="1195" y="305" width="370" height="100" rx="14" class="outcome"/><text x="1380" y="338" text-anchor="middle" class="small">表9-1 + 工程证据</text><text x="1380" y="370" text-anchor="middle" class="small">PASS / FAIL /</text><text x="1380" y="400" text-anchor="middle" class="small">UNDETERMINED</text>

    <rect x="35" y="425" width="300" height="100" rx="14" class="cell"/><text x="185" y="465" text-anchor="middle" class="body">repeatability</text><text x="185" y="506" text-anchor="middle" class="small">+ retention</text>
    <rect x="355" y="425" width="205" height="100" rx="14" class="exp"/><text x="457" y="486" text-anchor="middle" class="head">EXP-03</text>
    <rect x="580" y="425" width="355" height="100" rx="14" class="evidence"/><text x="757" y="465" text-anchor="middle" class="small">成对点云 + 场景标签</text><text x="757" y="506" text-anchor="middle" class="small">匹配 / 无效 / 零特征记录</text>
    <rect x="955" y="425" width="220" height="100" rx="14" class="cell"/><text x="1065" y="465" text-anchor="middle" class="small">独立matcher</text><text x="1065" y="506" text-anchor="middle" class="small">分层统计</text>
    <rect x="1195" y="425" width="370" height="100" rx="14" class="outcome"/><text x="1380" y="458" text-anchor="middle" class="small">图9-3 + 表9-2</text><text x="1380" y="490" text-anchor="middle" class="small">PASS / FAIL /</text><text x="1380" y="520" text-anchor="middle" class="small">UNDETERMINED</text>

    <rect x="35" y="545" width="300" height="100" rx="14" class="cell"/><text x="185" y="585" text-anchor="middle" class="body">relocalization</text><text x="185" y="626" text-anchor="middle" class="small">成功率 / 恢复时间</text>
    <rect x="355" y="545" width="205" height="100" rx="14" class="exp"/><text x="457" y="606" text-anchor="middle" class="head">EXP-04</text>
