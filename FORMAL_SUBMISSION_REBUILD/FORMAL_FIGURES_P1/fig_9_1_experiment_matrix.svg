    <rect x="955" y="545" width="220" height="100" rx="14" class="cell"/><text x="1065" y="585" text-anchor="middle" class="small">冻结判据</text><text x="1065" y="626" text-anchor="middle" class="small">CI / 时间统计</text>
    <rect x="1195" y="545" width="370" height="100" rx="14" class="outcome"/><text x="1380" y="578" text-anchor="middle" class="small">图9-4 + 表9-2</text><text x="1380" y="610" text-anchor="middle" class="small">PASS / FAIL /</text><text x="1380" y="640" text-anchor="middle" class="small">UNDETERMINED</text>

    <rect x="35" y="665" width="300" height="100" rx="14" class="cell"/><text x="185" y="705" text-anchor="middle" class="body">short-message</text><text x="185" y="746" text-anchor="middle" class="small">端到端样机集成</text>
    <rect x="355" y="665" width="205" height="100" rx="14" class="exp"/><text x="457" y="726" text-anchor="middle" class="head">EXP-05</text>
    <rect x="580" y="665" width="355" height="100" rx="14" class="evidence"/><text x="757" y="698" text-anchor="middle" class="small">发送 / 终端 / 远端日志</text><text x="757" y="729" text-anchor="middle" class="small">message ID + 时间戳</text><text x="757" y="760" text-anchor="middle" class="small">+ 远端回执</text>
    <rect x="955" y="665" width="220" height="100" rx="14" class="cell"/><text x="1065" y="705" text-anchor="middle" class="small">送达 / 时延</text><text x="1065" y="746" text-anchor="middle" class="small">端到端关联</text>
    <rect x="1195" y="665" width="370" height="100" rx="14" class="outcome"/><text x="1380" y="698" text-anchor="middle" class="small">图9-5 + 表9-2</text><text x="1380" y="730" text-anchor="middle" class="small">PASS / FAIL /</text><text x="1380" y="760" text-anchor="middle" class="small">UNDETERMINED</text>
