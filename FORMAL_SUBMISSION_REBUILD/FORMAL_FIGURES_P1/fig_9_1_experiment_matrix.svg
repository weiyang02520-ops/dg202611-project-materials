  <rect width="1600" height="900" fill="#fff"/><text x="800" y="56" text-anchor="middle" class="title">图9-1  EXP-01～05 正式实验矩阵与证据链</text>
  <g>
    <rect x="35" y="92" width="300" height="70" rx="12" class="h1"/><rect x="355" y="92" width="205" height="70" rx="12" class="h1"/><rect x="580" y="92" width="355" height="70" rx="12" class="h2"/><rect x="955" y="92" width="220" height="70" rx="12" class="h3"/><rect x="1195" y="92" width="370" height="70" rx="12" class="h4"/>
    <text x="185" y="120" text-anchor="middle" class="small" font-weight="700">Official metric /</text><text x="185" y="153" text-anchor="middle" class="small" font-weight="700">requirement</text><text x="457" y="137" text-anchor="middle" class="head">正式实验</text><text x="757" y="137" text-anchor="middle" class="head">truth / raw data / logs</text><text x="1065" y="137" text-anchor="middle" class="head">evaluator</text><text x="1380" y="120" text-anchor="middle" class="small" font-weight="700">result figure / table</text><text x="1380" y="153" text-anchor="middle" class="small" font-weight="700">→ 判定</text>
  </g>

  <g>
    <rect x="35" y="185" width="300" height="100" rx="14" class="cell"/><text x="185" y="225" text-anchor="middle" class="body">平面 / 高程</text><text x="185" y="266" text-anchor="middle" class="small">定位误差与连续性</text>
    <rect x="355" y="185" width="205" height="100" rx="14" class="exp"/><text x="457" y="246" text-anchor="middle" class="head">EXP-01</text>
    <rect x="580" y="185" width="355" height="100" rx="14" class="evidence"/><text x="757" y="225" text-anchor="middle" class="small">同步真值 + 估计轨迹</text><text x="757" y="266" text-anchor="middle" class="small">退化区间 + 有效性掩码</text>
    <rect x="955" y="185" width="220" height="100" rx="14" class="cell"/><text x="1065" y="225" text-anchor="middle" class="small">误差 / 覆盖率</text><text x="1065" y="266" text-anchor="middle" class="small">复算与统计</text>
